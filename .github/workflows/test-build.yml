name: Auto Build Test Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'folia-major/**'
      - 'fn_build/manifest'

jobs:
  build-source-on-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            folia-major/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install Folia dependencies
        run: |
          cd folia-major
          npm ci

      - name: Build Folia
        run: |
          cd folia-major
          BUILD_BASE=./ npm run build

      - name: Copy Folia build assets to www
        run: |
          rm -rf www/folia
          mkdir -p www/folia
          cp -r folia-major/dist/* www/folia/

      - name: Prepare build environment
        run: |
          echo "Preparing build directory..."
          mkdir -p fn_build/app/server
          mkdir -p fn_build/app/www
          cp -r server/* fn_build/app/server/
          cp -r www/* fn_build/app/www/
          chmod +x fn_build/fnpack-1.2.1-linux-amd64

      - name: Extract Version from Manifest
        id: version
        run: |
          VERSION_NUM=$(grep "^version" fn_build/manifest | awk -F'=' '{print $2}' | xargs)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${VERSION_NUM}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Source Package
        id: build_source
        run: |
          echo "Building Source Package..."
          cd fn_build
          ./fnpack-1.2.1-linux-amd64 build
          SOURCE_FPK_NAME="2fmusic-${{ steps.version.outputs.version }}.fpk"
          if [ -f "yuexps.2fmusic.fpk" ]; then
            mv yuexps.2fmusic.fpk "$SOURCE_FPK_NAME"
            echo "Built: $SOURCE_FPK_NAME"
          else
            echo "Error: yuexps.2fmusic.fpk not found!"
            exit 1
          fi
          echo "source_pkg=$SOURCE_FPK_NAME" >> $GITHUB_OUTPUT

      - name: Upload Source FPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2fmusic-fpk-test
          path: fn_build/${{ steps.build_source.outputs.source_pkg }}
          if-no-files-found: error
