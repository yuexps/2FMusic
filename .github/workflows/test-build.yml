name: Auto Build Test Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'fn_build/manifest'

jobs:
  build-source-on-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Sync frontend assets to backend
        run: |
          rm -rf backend/static/dist
          mkdir -p backend/static/dist
          cp -r frontend/dist/* backend/static/dist/

      - name: Build Go binaries
        run: |
          cd backend
          echo "Building Go x86_64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o 2fmusic-x86 main.go
          echo "Building Go ARM64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o 2fmusic-arm main.go

      - name: Extract Version from Manifest
        id: version
        run: |
          VERSION_NUM=$(grep "^version" fn_build/manifest | awk -F'=' '{print $2}' | xargs)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION_NUM}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Prepare Build Directories
        run: |
          rm -rf fn_build_x86 fn_build_arm
          cp -r fn_build fn_build_x86
          cp -r fn_build fn_build_arm

      - name: Build Go x86 FPK Package
        run: |
          sed -i 's/^platform.*/platform              = x86/' fn_build_x86/manifest
          rm -rf fn_build_x86/app/*
          cp backend/2fmusic-x86 fn_build_x86/app/2fmusic
          chmod +x fn_build_x86/app/2fmusic fn_build_x86/fnpack-1.2.1-linux-amd64
          cd fn_build_x86
          ./fnpack-1.2.1-linux-amd64 build
          PKG_NAME="2fmusic-${{ steps.version.outputs.version }}-x86.fpk"
          [ -f "yuexps.2fmusic.fpk" ] && mv yuexps.2fmusic.fpk "$PKG_NAME" || { echo "Error: fpk not found!"; exit 1; }
          echo "Built: $PKG_NAME"

      - name: Build Go ARM FPK Package
        run: |
          sed -i 's/^platform.*/platform              = arm/' fn_build_arm/manifest
          rm -rf fn_build_arm/app/*
          cp backend/2fmusic-arm fn_build_arm/app/2fmusic
          chmod +x fn_build_arm/app/2fmusic fn_build_arm/fnpack-1.2.1-linux-amd64
          cd fn_build_arm
          ./fnpack-1.2.1-linux-amd64 build
          PKG_NAME="2fmusic-${{ steps.version.outputs.version }}-arm.fpk"
          [ -f "yuexps.2fmusic.fpk" ] && mv yuexps.2fmusic.fpk "$PKG_NAME" || { echo "Error: fpk not found!"; exit 1; }
          echo "Built: $PKG_NAME"

      - name: Upload FPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2fmusic-fpk-packages
          path: |
            fn_build_x86/*.fpk
            fn_build_arm/*.fpk
          if-no-files-found: error
